<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12a846">
    <title>Prize Redemption | Encore Creations</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            background: #12a846;
            color: #fff;
            transition: background-color 180ms ease;
        }
        body.redeemed { background: #b31220; }
        body.expired { background: #5d1820; }
        body.error { background: #171717; }
        .page {
            width: 100%;
            min-height: 100svh;
            padding: max(40px, env(safe-area-inset-top)) 6vw max(40px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            text-align: center;
            background-image: radial-gradient(circle at 50% 20%, rgba(255,255,255,.22), transparent 42%);
        }
        .brand { font: 900 clamp(22px, 5vw, 54px)/1 Arial, sans-serif; letter-spacing: .12em; }
        .icon { font: 900 clamp(84px, 25vw, 250px)/1 Arial, sans-serif; filter: drop-shadow(0 8px 0 rgba(0,0,0,.2)); }
        h1 { margin: 0; font-size: clamp(70px, 19vw, 190px); line-height: .88; letter-spacing: .02em; text-shadow: 0 8px 0 rgba(0,0,0,.25); }
        .details { width: min(92vw, 900px); }
        .label { margin: 30px 0 8px; font: 800 clamp(18px, 4vw, 38px)/1.1 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; opacity: .82; }
        .value { margin: 0; font-size: clamp(44px, 12vw, 120px); line-height: .95; overflow-wrap: anywhere; }
        .session { font: 800 clamp(22px, 5vw, 48px)/1.15 Arial, sans-serif; }
        .date { font: 700 clamp(20px, 4.5vw, 42px)/1.25 Arial, sans-serif; }
        button {
            width: min(90vw, 850px);
            min-height: 120px;
            border: 6px solid rgba(255,255,255,.85);
            border-radius: 32px;
            background: #087c31;
            color: #fff;
            padding: 26px;
            font: 900 clamp(34px, 8vw, 76px)/1 Arial, sans-serif;
            box-shadow: 0 14px 0 rgba(0,0,0,.28);
        }
        button:active { transform: translateY(6px); box-shadow: 0 8px 0 rgba(0,0,0,.28); }
        .hidden { display: none !important; }
        dialog {
            width: min(90vw, 820px);
            border: 6px solid #f2c94c;
            border-radius: 32px;
            background: #111;
            color: #fff;
            padding: 48px 30px;
            text-align: center;
        }
        dialog::backdrop { background: rgba(0,0,0,.78); }
        dialog p { margin: 0 0 40px; font: 900 clamp(36px, 8vw, 72px)/1.05 Arial, sans-serif; }
        .dialog-actions { display: flex; gap: 22px; }
        .dialog-actions button { min-height: 90px; font-size: clamp(28px, 6vw, 54px); }
        #cancel-button { background: #444; }
        .loading { font: 800 clamp(28px, 7vw, 64px)/1.1 Arial, sans-serif; }
    </style>
</head>
<body>
    <main class="page" aria-live="polite">
        <div class="brand">ENCORE CREATIONS</div>
        <div class="icon" id="status-icon" aria-hidden="true">★</div>
        <h1 id="status-title">CHECKING</h1>
        <section class="details hidden" id="details">
            <p class="label">Prize</p>
            <p class="value" id="prize"></p>
            <p class="label">Session ID</p>
            <p class="session" id="session"></p>
            <div id="redeemed-details" class="hidden">
                <p class="label">Redeemed</p>
                <p class="date" id="redeemed-time"></p>
            </div>
        </section>
        <p class="loading" id="message">Looking up prize...</p>
        <button class="hidden" id="redeem-button" type="button">REDEEM PRIZE</button>
    </main>

    <dialog id="confirmation">
        <p>Redeem this prize?</p>
        <div class="dialog-actions">
            <button id="confirm-button" type="button">YES</button>
            <button id="cancel-button" type="button">CANCEL</button>
        </div>
    </dialog>

    <script>
        const sessionId = new URLSearchParams(window.location.search).get("session");
        const title = document.querySelector("#status-title");
        const icon = document.querySelector("#status-icon");
        const details = document.querySelector("#details");
        const prize = document.querySelector("#prize");
        const session = document.querySelector("#session");
        const message = document.querySelector("#message");
        const redeemedDetails = document.querySelector("#redeemed-details");
        const redeemedTime = document.querySelector("#redeemed-time");
        const redeemButton = document.querySelector("#redeem-button");
        const confirmation = document.querySelector("#confirmation");

        function showError(text) {
            document.body.className = "error";
            title.textContent = "UNAVAILABLE";
            icon.textContent = "!";
            message.textContent = text;
            details.classList.add("hidden");
            redeemButton.classList.add("hidden");
        }

        function render(record) {
            const alreadyRedeemed = record.redeemed === true || record.status === "redeemed";
            const expired = !alreadyRedeemed && record.status === "expired";
            document.body.className = alreadyRedeemed ? "redeemed" : (expired ? "expired" : "");
            title.textContent = alreadyRedeemed ? "ALREADY REDEEMED" : (expired ? "EXPIRED" : "VALID");
            icon.textContent = alreadyRedeemed || expired ? "✕" : "✓";
            prize.textContent = record.prize;
            session.textContent = record.session;
            details.classList.remove("hidden");
            if (expired) {
                const [year, month, day] = record.expiration_date.split("-");
                message.textContent = `This coupon expired on ${month}/${day}/${year}.`;
                message.classList.remove("hidden");
            } else {
                message.classList.add("hidden");
            }
            redeemButton.classList.toggle("hidden", alreadyRedeemed || expired);
            redeemedDetails.classList.toggle("hidden", !alreadyRedeemed);
            if (alreadyRedeemed && record.redeemed_time) {
                redeemedTime.textContent = new Date(record.redeemed_time).toLocaleString();
            }
        }

        async function loadRedemption() {
            if (!sessionId) {
                showError("Missing Session ID");
                return;
            }
            try {
                const response = await fetch(`/api/redeem?session=${encodeURIComponent(sessionId)}`, { cache: "no-store" });
                if (!response.ok) throw new Error(response.status === 404 ? "Prize session not found" : "Unable to load prize");
                render(await response.json());
            } catch (error) {
                showError(error.message);
            }
        }

        redeemButton.addEventListener("click", () => confirmation.showModal());
        document.querySelector("#cancel-button").addEventListener("click", () => confirmation.close());
        document.querySelector("#confirm-button").addEventListener("click", async () => {
            confirmation.close();
            redeemButton.disabled = true;
            try {
                const response = await fetch("/api/redeem", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session: sessionId }),
                });
                if (!response.ok) throw new Error("Unable to redeem prize");
                window.location.reload();
            } catch (error) {
                redeemButton.disabled = false;
                showError(error.message);
            }
        });

        loadRedemption();
    </script>
</body>
</html>
