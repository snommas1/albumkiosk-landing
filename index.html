<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Your Photo is Ready!</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #000000;
        }

        /*
         * Keep the stage at the artwork's native 841:1870 aspect ratio and
         * scale it with a contain fit. The complete artwork remains visible;
         * unmatched screen space becomes a small black letterbox area.
         */
        .artwork-stage {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(100vw, calc(100vh * 841 / 1870));
            width: min(100%, calc(100dvh * 841 / 1870));
            height: min(100vh, calc(100vw * 1870 / 841));
            height: min(100%, calc(100vw * 1870 / 841));
            transform: translate(-50%, -50%);
        }

        .artwork {
            display: block;
            width: 100%;
            height: 100%;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Transparent tap target over the button printed in the PNG. */
        .download-button {
            position: absolute;
            top: 67.7%;
            left: 5.35%;
            width: 91.2%;
            height: 15.7%;
            border: 0;
            border-radius: 12%;
            background: transparent;
            color: transparent;
            -webkit-tap-highlight-color: transparent;
        }

        .download-button:focus-visible {
            outline: 4px solid #ffffff;
            outline-offset: -8px;
        }

    </style>
</head>
<body>
    <main class="artwork-stage">
        <img
            class="artwork"
            src="assets/your-photo-is-ready.png"
            alt="Encore Creations — Your Photo is Ready!"
        >
        <a
            class="download-button"
            href="https://google.com"
            aria-label="Download My Photo"
        >Download My Photo</a>
    </main>
    <script>
        const artworkStage = document.querySelector(".artwork-stage");
        const parameters = new URLSearchParams(window.location.search);
        const sessionId = parameters.get("session");
        const posterUrl = parameters.get("poster");
        const downloadButton = document.querySelector(".download-button");

        function sizeArtworkToFit() {
            const scale = Math.min(
                window.innerWidth / 841,
                window.innerHeight / 1870
            );
            const width = Math.floor(841 * scale * 1000) / 1000;
            const height = Math.floor(1870 * scale * 1000) / 1000;
            artworkStage.style.width = `${width}px`;
            artworkStage.style.height = `${height}px`;
            artworkStage.style.left = `${Math.max(0, (window.innerWidth - width) / 2)}px`;
            artworkStage.style.top = `${Math.max(0, (window.innerHeight - height) / 2)}px`;
            artworkStage.style.transform = "none";
        }

        sizeArtworkToFit();
        window.addEventListener("resize", sizeArtworkToFit);

        if (sessionId) {
            document.documentElement.dataset.session = sessionId;
        }

        if (posterUrl) {
            try {
                const destination = new URL(posterUrl);
                if (destination.protocol === "https:" || destination.protocol === "http:") {
                    downloadButton.href = destination.href;
                }
            } catch (error) {
                console.error("Invalid poster URL supplied to landing page.", error);
            }
        }
    </script>
</body>
</html>
