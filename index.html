<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Your Photo is Ready!</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #5b0874;
        }

        /*
         * Keep the stage at the artwork's native 841:1870 aspect ratio and
         * scale it with a cover fit. Any necessary crop happens only at the
         * outer edges, so the artwork and clickable button stay aligned.
         */
        .artwork-stage {
            position: fixed;
            top: 50%;
            left: 50%;
            width: calc(100vh * 841 / 1870);
            width: calc(100dvh * 841 / 1870);
            height: 100vh;
            height: 100dvh;
            transform: translate(-50%, -50%);
        }

        .artwork {
            display: block;
            width: 100%;
            height: 100%;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Transparent tap target over the button printed in the PNG. */
        .download-button {
            position: absolute;
            top: 67.7%;
            left: 5.35%;
            width: 91.2%;
            height: 15.7%;
            border: 0;
            border-radius: 12%;
            background: transparent;
            color: transparent;
            -webkit-tap-highlight-color: transparent;
        }

        .download-button:focus-visible {
            outline: 4px solid #ffffff;
            outline-offset: -8px;
        }

        @media (min-aspect-ratio: 841 / 1870) {
            .artwork-stage {
                width: 100vw;
                height: calc(100vw * 1870 / 841);
            }
        }
    </style>
</head>
<body>
    <main class="artwork-stage">
        <img
            class="artwork"
            src="assets/your-photo-is-ready.png"
            alt="Encore Creations — Your Photo is Ready!"
        >
        <a
            class="download-button"
            href="https://google.com"
            aria-label="Download My Photo"
        >Download My Photo</a>
    </main>
</body>
</html>
