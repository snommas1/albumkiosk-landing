<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Preparing Your Photo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            background: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        main {
            width: min(100%, 520px);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: max(28px, env(safe-area-inset-top)) 24px 32px;
        }

        /* Reuse the genuine logo area from the supplied Encore artwork. */
        .logo-window {
            position: relative;
            width: min(84vw, 420px);
            aspect-ratio: 641 / 310;
            overflow: hidden;
            flex: 0 0 auto;
        }

        .logo-artwork {
            position: absolute;
            top: 0;
            left: -15.6%;
            display: block;
            width: 131.2%;
            height: auto;
        }

        .loading-content {
            margin: clamp(52px, 10vh, 100px) 0 0;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 8vw, 2.8rem);
            line-height: 1.15;
        }

        .spinner {
            width: 68px;
            height: 68px;
            margin: 38px auto 26px;
            border: 7px solid rgba(255, 255, 255, 0.2);
            border-top-color: #94f500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .status {
            margin: 0;
            color: #c9c9c9;
            font-size: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation-duration: 1.6s;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="logo-window" aria-label="Encore Creations">
            <img
                class="logo-artwork"
                src="assets/your-photo-is-ready.png"
                alt="Encore Creations"
            >
        </div>

        <section class="loading-content" aria-live="polite">
            <h1>Preparing your photo...</h1>
            <div class="spinner" aria-hidden="true"></div>
            <p class="status">Please wait...</p>
        </section>
    </main>

    <script>
        const parameters = new URLSearchParams(window.location.search);
        const sessionId = parameters.get("session");
        const posterUrl = parameters.get("poster");
        const statusText = document.querySelector(".status");

        // Retain the session on the page for any configured tracking hook.
        if (sessionId) {
            document.documentElement.dataset.session = sessionId;
        }

        function redirectToPoster() {
            if (!posterUrl) {
                statusText.textContent = "Photo link unavailable.";
                return;
            }

            try {
                const destination = new URL(posterUrl);
                if (destination.protocol !== "https:" && destination.protocol !== "http:") {
                    throw new Error("Unsupported poster URL protocol.");
                }
                window.location.replace(destination.href);
            } catch (error) {
                console.error("Invalid poster URL supplied to landing page.", error);
                statusText.textContent = "Photo link unavailable.";
            }
        }

        // Leave enough time for the loading state to paint before redirecting.
        window.setTimeout(redirectToPoster, 650);
    </script>
</body>
</html>
